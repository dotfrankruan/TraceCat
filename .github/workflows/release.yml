name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build multi-arch binaries and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build dashboard assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run typecheck
          pnpm --dir web build

      - name: Build linux/amd64 and linux/arm64 binaries + tarballs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          commit="${GITHUB_SHA:0:12}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w \
            -X github.com/dotfrankruan/tracecat/internal/version.Version=${VERSION} \
            -X github.com/dotfrankruan/tracecat/internal/version.Commit=${commit} \
            -X github.com/dotfrankruan/tracecat/internal/version.BuildDate=${build_date}"

          rm -rf dist stage
          mkdir -p dist stage

          for arch in amd64 arm64; do
            for component in controller agent; do
              out="dist/tracecat-${component}-linux-${arch}"
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
                go build -trimpath -ldflags "${ldflags}" -o "${out}" "./cmd/tracecat-${component}"
            done

            mkdir -p "stage/controller-${arch}" "stage/agent-${arch}"

            # Controller bundle
            mkdir -p "stage/controller-${arch}"/{bin,configs,deploy/systemd}
            cp "dist/tracecat-controller-linux-${arch}" "stage/controller-${arch}/bin/tracecat-controller"
            cp configs/controller.example.json "stage/controller-${arch}/configs/"
            cp deploy/systemd/tracecat-controller.service deploy/systemd/tracecat-controller.env.example \
              "stage/controller-${arch}/deploy/systemd/"
            cp deploy/install.sh deploy/quickstart.sh QUICKSTART.md CHANGELOG.md LICENSE NOTICE README.md SECURITY.md "stage/controller-${arch}/"
            cp -r docs "stage/controller-${arch}/"
            rm -rf "stage/controller-${arch}/docs/screenshots"
            printf '%s\n' "${VERSION}" > "stage/controller-${arch}/VERSION"
            tar -czf "dist/tracecat-controller-linux-${arch}.tar.gz" \
              -C "stage/controller-${arch}" .

            # Agent bundle
            mkdir -p "stage/agent-${arch}"/{bin,configs,deploy/systemd}
            cp "dist/tracecat-agent-linux-${arch}" "stage/agent-${arch}/bin/tracecat-agent"
            cp configs/agent.example.json "stage/agent-${arch}/configs/"
            cp deploy/systemd/tracecat-agent.service deploy/systemd/tracecat-agent.env.example \
              "stage/agent-${arch}/deploy/systemd/"
            cp deploy/install.sh deploy/quickstart.sh QUICKSTART.md CHANGELOG.md LICENSE NOTICE README.md SECURITY.md "stage/agent-${arch}/"
            cp -r docs "stage/agent-${arch}/"
            rm -rf "stage/agent-${arch}/docs/screenshots"
            printf '%s\n' "${VERSION}" > "stage/agent-${arch}/VERSION"
            tar -czf "dist/tracecat-agent-linux-${arch}.tar.gz" \
              -C "stage/agent-${arch}" .
          done

          # Keep the raw binaries in dist/; only tarballs and checksums are
          # attached to the release below.
          (cd dist && sha256sum tracecat-*.tar.gz > checksums.txt)
          echo "--- release assets ---"
          ls -lh dist
          cat dist/checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tracecat-*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
